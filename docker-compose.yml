# ============================================================
# MAIS_IA — Docker Compose (Fase 1: Infraestructura)
# Servicios: PostgreSQL 16, Qdrant v1.18, Redis 7
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 16 — Base de datos relacional para metadatos,
  # historial de chats y métricas del sistema.
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: MAIS_IA-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-MAIS_IA}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MAIS_IA_secret}
      POSTGRES_DB: ${POSTGRES_DB:-MAIS_IA}
      TZ: Europe/Madrid
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-MAIS_IA} -d ${POSTGRES_DB:-MAIS_IA}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  # ----------------------------------------------------------
  # Qdrant v1.18 — Base de datos vectorial para búsqueda
  # densa (embeddings) y esparsa (sparse vectors / BM25).
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: MAIS_IA-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  # ----------------------------------------------------------
  # Redis 7 — Broker de mensajes para Celery y caché de
  # sesiones/resultados intermedios.
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: MAIS_IA-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  aegis-network:
    driver: bridge
